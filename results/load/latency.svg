ext><text class="label" x="262.40" y="330" text-anchor="middle">Burst</text><text class="tick" x="262.40" y="346" text-anchor="middle">5,000 bets</text><path class="s1" d="M375.00,312.00 V310.82 Q375.00,306.82 379.00,306.82 H395.00 Q399.00,306.82 399.00,310.82 V312.00 Z"><title>Stress 2x p50: 9.4 ms</title></path><path class="s2" d="M401.00,312.00 V288.68 Q401.00,284.68 405.00,284.68 H421.00 Q425.00,284.68 425.00,288.68 V312.00 Z"><title>Stress 2x p95: 49.7 ms</title></path><text class="value" x="413.00" y="278.68" text-anchor="middle">50 ms</text><text class="label" x="400.00" y="330" text-anchor="middle">Stress 2x</text><text class="tick" x="400.00" y="346" text-anchor="middle">10,000 bets</text><path class="s1" d="M512.60,312.00 V289.56 Q512.60,285.56 516.60,285.56 H532.60 Q536.60,285.56 536.60,289.56 V312.00 Z"><title>Stress 5x p50: 48.1 ms</title></path><path class="s2" d="M538.60,312.00 V193.42 Q538.60,189.42 542.60,189.42 H558.60 Q562.60,189.42 562.60,193.42 V312.00 Z"><title>Stress 5x p95: 222.9 ms</title></path><text class="value" x="550.60" y="183.42" text-anchor="middle">223 ms</text><text class="label" x="537.60" y="330" text-anchor="middle">Stress 5x</text><text class="tick" x="537.60" y="346" text-anchor="middle">25,000 bets</text><path class="s1" d="M650.20,312.00 V270.50 Q650.20,266.50 654.20,266.50 H670.20 Q674.20,266.50 674.20,270.50 V312.00 Z"><title>Stress 10x p50: 82.7 ms</title></path><path class="s2" d="M676.20,312.00 V135.97 Q676.20,131.97 680.20,131.97 H696.20 Q700.20,131.97 700.20,135.97 V312.00 Z"><title>Stress 10x p95: 327.3 ms</title></path><text class="value" x="688.20" y="125.97" text-anchor="middle">327 ms</text><text class="label" x="675.20" y="330" text-anchor="middle">Stress 10x</text><text class="tick" x="675.20" y="346" text-anchor="middle">50,000 bets</text></svg>