<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-labelledby="t"><title id="t">Concurrency test summary</title><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--s1:#3987e5;--s2:#d95926}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}
.bg{fill:var(--surface)}.title{fill:var(--ink);font-size:15px;font-weight:600}.label{font-size:12px}.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.marker{stroke:var(--ink2);stroke-width:1}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.tile{fill:var(--surface);stroke:var(--border);stroke-width:1}
.value{fill:var(--ink);font-size:30px;font-weight:600}.caption{font-size:12px;fill:var(--muted)}
</style><rect class="tile" x="0.5" y="0.5" width="239" height="149" rx="8"/><text class="label" x="16" y="30">Same user, 200 simultaneous bets</text><text class="value" x="16" y="74">1 accepted</text><text class="caption" x="16" y="104">199 rejected as duplicates</text><text class="caption" x="16" y="124">balance debited once</text><rect class="tile" x="260.5" y="0.5" width="239" height="149" rx="8"/><text class="label" x="276" y="30">Queue full (capacity 16)</text><text class="value" x="276" y="74">484 rejected</text><text class="caption" x="276" y="104">immediately, waited 0 ms</text><text class="caption" x="276" y="124">16 queued bets accepted later</text><rect class="tile" x="520.5" y="0.5" width="239" height="149" rx="8"/><text class="label" x="536" y="30">Runs with the race detector</text><text class="value" x="536" y="74">60 / 60 passed</text><text class="caption" x="536" y="104">3 tests, repeated</text><text class="caption" x="536" y="124">no data races reported</text></svg>